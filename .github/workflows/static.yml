# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Scramjet STATIC engine assets
        run: |
          mkdir -p /tmp/scramjet-static
          curl -fsSL https://github.com/hahahah67-pixel/scramjet-static/archive/refs/heads/main.tar.gz | tar -xz --strip-components=1 -C /tmp/scramjet-static
          mkdir -p scramjet-static
          cp -R /tmp/scramjet-static/bare-mux /tmp/scramjet-static/scramjet-engine /tmp/scramjet-static/transport scramjet-static/
          cp /tmp/scramjet-static/sw.js /tmp/scramjet-static/LICENSE scramjet-static/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

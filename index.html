<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HedgeOS</title>
<script src="https://js.puter.com/v2/"></script>
<link rel="stylesheet" href="styles/desktop.css">
<link rel="stylesheet" href="styles/windows.css">
<link rel="stylesheet" href="styles/themes.css">
</head>
<body>

<div id="boot-screen">
  <div id="boot-logo">🌿</div>
  <div id="boot-name">HedgeOS</div>
  <div id="boot-bar"><div id="boot-fill"></div></div>
  <div id="boot-status">Starting up...</div>
</div>

<div id="lock-screen" style="display:none">
  <div id="lock-time"></div>
  <div id="lock-date"></div>
  <div id="lock-user">🌿 HedgeOS</div>
  <input id="lock-pin" type="password" placeholder="PIN (press Enter to skip)" maxlength="6">
  <button id="lock-btn">Unlock</button>
</div>

<div id="desktop" style="display:none">
  <div id="wallpaper"></div>

  <div id="desktop-icons"></div>

  <div id="notification-area"></div>

  <div id="context-menu" style="display:none">
    <div class="ctx-item" data-action="refresh">🔄 Refresh Desktop</div>
    <div class="ctx-item" data-action="wallpaper">🖼 Change Wallpaper</div>
    <div class="ctx-item" data-action="newfile">📄 New Text File</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-action="settings">⚙ Settings</div>
  </div>

  <div id="taskbar">
    <div id="start-btn">🌿 Hedge</div>
    <div id="taskbar-windows"></div>
    <div id="taskbar-tray">
      <div id="tray-notif" title="Notifications">🔔</div>
      <div id="tray-wifi" title="Network">📶</div>
      <div id="clock-display"></div>
    </div>
  </div>

  <div id="start-menu" style="display:none">
    <div id="start-header">
      <div id="start-user-avatar">🌿</div>
      <div id="start-user-name">HedgeOS User</div>
    </div>
    <input id="start-search" placeholder="Search apps..." autocomplete="off">
    <div id="start-apps"></div>
    <div id="start-footer">
      <div class="start-foot-btn" data-action="settings" title="Settings">⚙</div>
      <div class="start-foot-btn" data-action="power" title="Power">⏻</div>
    </div>
  </div>

  <div id="power-menu" style="display:none">
    <div class="power-item" data-action="lock">🔒 Lock</div>
    <div class="power-item" data-action="restart">🔄 Restart</div>
    <div class="power-item" data-action="shutdown">⏻ Shut Down</div>
  </div>

</div>

<script src="core/system.js"></script>
<script src="core/windowManager.js"></script>
<script src="desktop/desktop.js"></script>
<script src="desktop/taskbar.js"></script>
<script src="desktop/startMenu.js"></script>
<script src="desktop/notifications.js"></script>
<script src="apps/file-explorer/app.js"></script>
<script src="apps/terminal/app.js"></script>
<script src="apps/settings/app.js"></script>
<script src="apps/browser/app.js"></script>
<script src="core/boot.js"></script>
</body>
</html>
